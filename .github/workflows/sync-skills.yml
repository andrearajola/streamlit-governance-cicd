name: Sync skills

# push dev  -> changed skills published to DB_COCO_SKILLS.SKILLS_DEV ("[DEV]", hidden, READ to <SKILL>_SKILL_DEV)
# push main -> changed skills published to SKILLS_PRD (certified + release email to <SKILL>_SKILL_USERS)
# The per-skill roles are created by the pipeline (SP_SKILL_CREATE_ROLES). Logic lives in Snowflake.
on:
  push:
    branches: [dev, main]
    paths: ['skills/**', 'ci/sync_skills.py', '.github/workflows/sync-skills.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SNOWFLAKE_ACCOUNT: SFPSCOGS-ARAJOLA

# One sync at a time per branch (deploy state is per branch). Per-branch so a prd sync waiting
# for approval never blocks dev syncs.
concurrency:
  group: skill-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./ci/validate_skills.sh

  sync:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.2
      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
      - name: Upload skills and sync (Snowflake)
        env:
          BRANCH: ${{ github.ref_name }}
        run: python ci/sync_skills.py --branch "$BRANCH" --commit "$GITHUB_SHA"
